name: CI Pipeline (Build + CodeLogic Scan)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: build-scan-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: Release
  PUBLISH_OUTPUT: artifacts/out
  SOLUTION: VirtoCommerce.Platform.sln

jobs:
  build-and-scan:
    name: Build + CodeLogic Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore, build, publish (capture build.log for CodeLogic)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          mkdir -p "${GITHUB_WORKSPACE}/logs"
          BUILD_LOG="${GITHUB_WORKSPACE}/logs/build.log"
          echo "BUILD_LOG=${BUILD_LOG}" >> "$GITHUB_ENV"
          mkdir -p "${{ env.PUBLISH_OUTPUT }}"

          SLN="${{ env.SOLUTION }}"
          {
            echo "========== CI build log =========="
            echo "Repository: ${{ github.repository }}"
            echo "Workflow: ${{ github.workflow }}  Run: ${{ github.run_id }}  Attempt: ${{ github.run_attempt }}"
            echo "Ref: ${{ github.ref }}  SHA: ${{ github.sha }}"
            echo "========== dotnet --version =========="
            dotnet --version
            echo "========== Restore =========="
            dotnet restore "$SLN" -p:NuGetAudit=false
            echo "========== Build =========="
            dotnet build "$SLN" \
              -c "${{ env.BUILD_CONFIGURATION }}" \
              /p:TreatWarningsAsErrors=false \
              -p:NuGetAudit=false \
              -p:DeployOnBuild=false \
              --no-restore
            echo "========== Publish =========="
            dotnet publish "$SLN" \
              -c "${{ env.BUILD_CONFIGURATION }}" \
              --no-build \
              -o "${{ env.PUBLISH_OUTPUT }}" \
              /p:TreatWarningsAsErrors=false \
              -p:NuGetAudit=false \
              -p:DeployOnBuild=false \
              -p:DeployOnPublish=False
            echo "========== Done =========="
          } 2>&1 | tee -a "${BUILD_LOG}"

      - name: Upload publish output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-publish
          path: ${{ env.PUBLISH_OUTPUT }}
          if-no-files-found: error

      - name: Run CodeLogic Scan (published output + ref-path)
        if: always()
        env:
          CODELOGIC_HOST: ${{ vars.CODELOGIC_HOST }}
          AGENT_UUID: ${{ secrets.AGENT_UUID }}
          AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
          CODELOGIC_APPLICATION_NAME: ${{ vars.CODELOGIC_APPLICATION_NAME }}
          CODELOGIC_SCAN_SPACE_NAME: ${{ vars.CODELOGIC_SCAN_SPACE_NAME }}
          CODELOGIC_ASSEMBLY_FILTERS: ${{ vars.CODELOGIC_ASSEMBLY_FILTERS }}
          CODELOGIC_METHOD_FILTERS: ${{ vars.CODELOGIC_METHOD_FILTERS }}
          CODELOGIC_DATABASE_IDENTITIES: ${{ vars.CODELOGIC_DATABASE_IDENTITIES }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="${GITHUB_WORKSPACE}/${{ env.PUBLISH_OUTPUT }}"
          "${GITHUB_WORKSPACE}/scripts/codelogic/run-dotnet-analyze.sh" "${PUBLISH_DIR}"

      - name: Send Build Info (with build log)
        if: always()
        env:
          CODELOGIC_HOST: ${{ vars.CODELOGIC_HOST }}
          AGENT_UUID: ${{ secrets.AGENT_UUID }}
          AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          GH_STATUS="${{ job.status }}"
          case "${GH_STATUS}" in
            success)   BUILD_STATUS="SUCCESS" ;;
            failure)   BUILD_STATUS="FAILURE" ;;
            cancelled) BUILD_STATUS="CANCELLED" ;;
            *)         BUILD_STATUS="${GH_STATUS^^}" ;;
          esac
          "${GITHUB_WORKSPACE}/scripts/codelogic/send-build-info.sh" "${BUILD_STATUS}"

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-build-log
          path: logs/build.log
          if-no-files-found: ignore
          retention-days: 14
